name: Deploy backend worker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Явно фиксируем NODE_ENV, чтобы `npm ci` гарантированно поставил
    # devDependencies (typescript, wrangler) независимо от того, что
    # выставлено на уровне организации/раннера по умолчанию.
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install deps
        working-directory: backend
        run: npm ci --include=dev

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          # Совпадает с диапазоном из backend/package.json (^4.0.0).
          # Если Wrangler уже стоит локально после `npm ci` — action его
          # переиспользует и не будет ничего ставить заново.
          wranglerVersion: "4"
          packageManager: npm
          command: deploy
