name = "race-hub-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# У проекта нет разделения на env.production/env.staging — один воркер,
# и это то, что реально задеплоено и обслуживает живых пользователей.
# ВНИМАНИЕ: значение "development" здесь было ошибкой — с ним
# routes/auth.ts::enforceFreshness (проверка свежести Telegram initData,
# защита от replay-атак на авторизацию) молча не срабатывала в проде,
# потому что сравнивается именно с "production" (см. src/env.ts,
# src/routes/auth.ts). Обнаружено и исправлено 16.09.2026 при аудите
# репозитория — до этой правки защита от replay была фактически выключена.
ENVIRONMENT = "production"

# Сколько тяжёлых фаз синка допускается за один тик cron. 1 — безопасно для
# Workers Free (10 мс CPU на запуск). На Workers Paid можно поставить "4".
SYNC_PHASES_PER_TICK = "1"

# Создать реальную БД: `npx wrangler d1 create race_hub_db`
# и вставить сюда возвращённый database_id перед деплоем.
[[d1_databases]]
binding = "DB"
database_name = "race_hub_db"
database_id = "56e32c0e-96dd-445f-818e-cd45b8f8b130"

# Два независимых триггера на один и тот же scheduled-хендлер (см.
# src/index.ts — разводятся по controller.cron):
#
# "*/5 * * * *"    — проверка "не пора ли напомнить о сессии"/результаты.
#   Идемпотентность обеспечивает notification_log (UNIQUE(user_id,
#   notification_key)), так что более частый/редкий интервал влияет
#   только на точность напоминания (± половина интервала), а не на риск
#   дублей.
#
# "1-56/5 * * * *" — наполнение D1 (cron/dataSync.ts): результаты этапов,
#   стендинги и карьера из них, календарь, фоновые задания. Раз в 5 минут
#   со сдвигом на минуту (отдельный запуск и отдельный лимит CPU от
#   триггера выше). Нагрузка на тик минимальна: каждая фаза сама решает,
#   есть ли ей работа (отпечатки/маркеры в app_state), и за тик
#   выполняется не больше SYNC_PHASES_PER_TICK тяжёлых фаз.
[triggers]
crons = ["*/5 * * * *", "1-56/5 * * * *"]

# Секрет задаётся отдельно и не хранится в репозитории:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
# (или Cloudflare Dashboard → Worker → Settings → Variables and Secrets)

[observability.logs]
enabled = true
invocation_logs = true
