name = "race-hub-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# Создать реальную БД: `npx wrangler d1 create race_hub_db`
# и вставить сюда возвращённый database_id перед деплоем.
[[d1_databases]]
binding = "DB"
database_name = "race_hub_db"
database_id = "56e32c0e-96dd-445f-818e-cd45b8f8b130"

# Проверка "не пора ли напомнить о сессии" — раз в 5 минут. Идемпотентность
# обеспечивает notification_log (UNIQUE(user_id, notification_key)), так
# что более частый/редкий интервал влияет только на точность напоминания
# (± половина интервала), а не на риск дублей.
[triggers]
crons = ["*/5 * * * *"]

# Секрет задаётся отдельно и не хранится в репозитории:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
# (или Cloudflare Dashboard → Worker → Settings → Variables and Secrets)

[observability.logs]
enabled = true
invocation_logs = true
